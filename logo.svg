  </defs>
  <!-- Flames -->
  <path d="M200 180 Q160 120 170 80 Q180 40 200 20 Q220 40 230 80 Q240 120 200 180" fill="url(#flame)" opacity="0.9"/>
  <path d="M160 190 Q130 140 140 100 Q150 60 165 50 Q175 80 170 120 Q165 160 160 190" fill="#ff6b1a" opacity="0.8"/>
  <path d="M240 190 Q270 140 260 100 Q250 60 235 50 Q225 80 230 120 Q235 160 240 190" fill="#e63900" opacity="0.8"/>
  <path d="M200 200 Q185 160 190 130 Q195 100 200 90 Q205 100 210 130 Q215 160 200 200" fill="#ffd700" opacity="0.7"/>
  <!-- Steak -->
