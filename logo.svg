  <!-- Text -->
  <text x="200" y="230" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#1a1a1a" stroke="#c9a227" stroke-width="1.5" text-anchor="middle">PRIME FIRE</text>
  <text x="200" y="255" font-family="Georgia, serif" font-size="14" fill="#c9a227" text-anchor="middle" letter-spacing="4">STEAKHOUSE</text>
